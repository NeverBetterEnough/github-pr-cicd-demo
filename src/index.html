<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub PR CI/CD 体验项目</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <main class="card">
    <p class="eyebrow">GitHub Actions Demo</p>
    <h1>迷你计算器</h1>
    <p>这个页面由合并到 main 分支后的 CD 工作流自动发布。</p>

    <form id="calculator-form">
      <label>
        第一个数字
        <input id="first-number" type="number" value="8" required />
      </label>

      <label>
        运算
        <select id="operator">
          <option value="add">加法</option>
          <option value="subtract">减法</option>
          <option value="multiply">乘法</option>
          <option value="divide">除法</option>
        </select>
      </label>

      <label>
        第二个数字
        <input id="second-number" type="number" value="3" required />
      </label>

      <button type="submit">计算</button>
    </form>

    <section class="result-panel">
      <span>结果</span>
      <strong id="result">11</strong>
    </section>
  </main>

  <main class="card">
    <h2>进制转换</h2>
    <p>在二进制、八进制、十进制、十六进制等之间自由转换（支持 2-36 进制）。</p>

    <form id="converter-form">
      <label>
        待转换数值
        <input id="convert-value" type="text" value="255" placeholder="输入数值" required />
      </label>

      <div class="base-row">
        <label class="base-label">
          源进制
          <input id="from-base" type="number" value="10" min="2" max="36" required />
        </label>

        <span class="base-arrow">→</span>

        <label class="base-label">
          目标进制
          <input id="to-base" type="number" value="16" min="2" max="36" required />
        </label>
      </div>

      <button type="submit">转换</button>
    </form>

    <section class="result-panel">
      <span>结果</span>
      <strong id="convert-result">FF</strong>
    </section>

    <details class="common-bases">
      <summary>常用进制参考</summary>
      <ul>
        <li>二进制 (Base 2)：0-1</li>
        <li>八进制 (Base 8)：0-7</li>
        <li>十进制 (Base 10)：0-9</li>
        <li>十六进制 (Base 16)：0-9, A-F</li>
      </ul>
    </details>
  </main>

  <script type="module" src="./app.js"></script>
</body>

</html>
