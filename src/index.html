<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>计算器</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="calculator">
    <div class="mode-bar">
      <button class="mode-btn" id="btn-adv" data-mode="adv" title="高级模式">𝑓</button>
      <button class="mode-btn active" data-mode="calc" title="标准计算">🔢</button>
      <button class="mode-btn" data-mode="base" title="进制转换">①⑥</button>
    </div>
    <div class="display" id="display">0</div>

    <div class="buttons" id="panel-calc">
      <button class="btn-func" data-action="clear">C</button>
      <button class="btn-func" data-action="negate">±</button>
      <button class="btn-op" data-action="operator" data-value="modulo">%</button>
      <button class="btn-op" data-action="operator" data-value="divide">÷</button>

      <button class="btn-num" data-action="digit" data-value="7">7</button>
      <button class="btn-num" data-action="digit" data-value="8">8</button>
      <button class="btn-num" data-action="digit" data-value="9">9</button>
      <button class="btn-op" data-action="operator" data-value="multiply">×</button>

      <button class="btn-num" data-action="digit" data-value="4">4</button>
      <button class="btn-num" data-action="digit" data-value="5">5</button>
      <button class="btn-num" data-action="digit" data-value="6">6</button>
      <button class="btn-op" data-action="operator" data-value="subtract">−</button>

      <button class="btn-num" data-action="digit" data-value="1">1</button>
      <button class="btn-num" data-action="digit" data-value="2">2</button>
      <button class="btn-num" data-action="digit" data-value="3">3</button>
      <button class="btn-op" data-action="operator" data-value="add">+</button>

      <button class="btn-num wide" data-action="digit" data-value="0">0</button>
      <button class="btn-num" data-action="decimal">.</button>
      <button class="btn-eq" data-action="equals">=</button>
    </div>

    <div class="adv-buttons" id="panel-adv" style="display:none">
      <button class="btn-adv" data-action="adv" data-value="sin">sin</button>
      <button class="btn-adv" data-action="adv" data-value="cos">cos</button>
      <button class="btn-adv" data-action="adv" data-value="tan">tan</button>
      <button class="btn-adv-const" data-action="constant" data-value="pi">π</button>

      <button class="btn-adv" data-action="adv" data-value="log10">log</button>
      <button class="btn-adv" data-action="adv" data-value="ln">ln</button>
      <button class="btn-adv" data-action="adv" data-value="power">xⁿ</button>
      <button class="btn-adv-const" data-action="constant" data-value="e">e</button>

      <button class="btn-adv" data-action="adv" data-value="sqrt">√</button>
      <button class="btn-adv" data-action="adv" data-value="cbrt">³√</button>
      <button class="btn-adv" data-action="adv" data-value="square">x²</button>
      <button class="btn-adv" data-action="adv" data-value="reciprocal">¹⁄ₓ</button>

      <button class="btn-adv" data-action="adv" data-value="factorial">n!</button>
      <button class="btn-func" data-action="delete">⌫</button>
    </div>

    <div class="base-panel" id="panel-base" style="display:none">
      <div class="base-inputs">
        <div class="base-field">
          <label>数值</label>
          <input id="convert-value" type="text" value="255" placeholder="输入数值" />
        </div>
        <div class="base-row-inline">
          <div class="base-field">
            <label>源进制</label>
            <input id="from-base" type="number" value="10" min="2" max="36" />
          </div>
          <span class="arrow">→</span>
          <div class="base-field">
            <label>目标进制</label>
            <input id="to-base" type="number" value="16" min="2" max="36" />
          </div>
        </div>
        <button class="btn-convert" id="btn-convert">转换</button>
      </div>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
